name: Temporary FCM dependency lockfile sync

on:
  push:
    branches:
      - fix/fcm-push-receiver-20261112

permissions:
  contents: write

jobs:
  update-lock:
    if: github.repository == 'Speedbreaker12/ioBroker.ring'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - name: Refresh npm dependency lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(lockfile): resolve fixed Ring FCM receiver"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
