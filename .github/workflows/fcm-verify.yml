name: Temporary FCM fix verification

on:
  push:
    branches:
      - fix/fcm-push-receiver-20261112

permissions:
  contents: read

jobs:
  verify:
    if: github.repository == 'Speedbreaker12/ioBroker.ring'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Check types
        run: npm run check
      - name: Build adapter backend
        run: npm run build:backend
      - name: Run adapter package and FCM regression tests
        run: npm test
      - name: Verify fresh consumer installation from package archive
        shell: bash
        run: |
          set -euo pipefail
          TGZ="$(npm pack --ignore-scripts)"
          mkdir -p "$RUNNER_TEMP/fcm-consumer"
          cd "$RUNNER_TEMP/fcm-consumer"
          printf '%s\n' '{"name":"fcm-test-consumer","version":"1.0.0","private":true}' > package.json
          npm install --no-audit --no-fund --ignore-scripts "$GITHUB_WORKSPACE/$TGZ"
          node <<'JS'
          const { createRequire } = require('node:module');
          const fs = require('node:fs');
          const path = require('node:path');
          const adapterRequire = createRequire(require.resolve('iobroker.ring/package.json'));
          const ringRequire = createRequire(adapterRequire.resolve('ring-client-api'));
          const receiverEntry = ringRequire.resolve('@eneris/push-receiver');
          const info = JSON.parse(fs.readFileSync(path.join(path.dirname(receiverEntry), '..', 'package.json'), 'utf8'));
          console.log('Actual receiver resolved from installed adapter:', info.version, receiverEntry);
          if (info.version !== '4.4.0') {
              throw new Error('Expected fixed FCM receiver version 4.4.0');
          }
          JS
